@page
@model SurpriseNoteModel
@{
    ViewData["Title"] = "Surprise Note";
}
<style>
    body {
        background-image: url('/images/ba.jpg') !important;
        background-repeat: no-repeat !important;
        background-size: 100vw 100vh !important;
        background-position: center !important;
        background-attachment: fixed !important;
        font-family: 'Poppins', sans-serif;
        margin: 0;
        height: 100vh;
        overflow: hidden;
    }

    /* Spotify Player sa kaliwang sulok */
    .spotify-container {
        position: fixed;
        top: 10%;
        left: 3%;
        width: 300px;
        z-index: 10;
    }

    /* Flexbox wrapper para i-center ang nilalaman */
    .center-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100%;
        position: relative;
    }

    /* Title sa Itaas */
    .page-title {
        position: absolute;
        top: 10%;
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-style: italic;
        font-size: 3.2rem;
        color: #4A2E2B; 
        text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.9);
        z-index: 3;
        pointer-events: none;
        letter-spacing: 1.5px;
        text-align: center;
    }

    /* Plain na larawan sa gitna */
    .center-image {
        max-width: 320px;
        width: 100%;
        height: auto;
        object-fit: contain;
        z-index: 2;
        margin-top: 25px;
    }

    /* Larawan sa Bottom Left */
    .bottom-left-img {
        position: absolute;
        bottom: 18%;
        left: -8%;
        max-width: 250px;
        width: 100%;
        height: auto;
        object-fit: contain;
        z-index: 3;
    }

    /* Larawan sa Bottom Right */
    .bottom-right-img {
        position: absolute;
        bottom: 17%;
        right: -7%;
        max-width: 250px;
        width: 100%;
        height: auto;
        object-fit: contain;
        z-index: 3;
    }

    /* Karagdagang Larawan sa Top Right Side */
    .top-right-img {
        position: absolute;
        top: 1%;
        right: -2%;
        max-width: 210px;
        width: 100%;
        height: auto;
        object-fit: contain;
        z-index: 3;
    }

    /* Estilo para sa floating text boxes na may puting border at background */
    .floating-note {
        position: absolute;
        background-color: #ffffff;
        border: 2px solid #ffffff;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.95rem;
        color: #333333;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        z-index: 3;
        pointer-events: none;
    }

    /* Pwesto ng mga notes sa palibot */
    .note-1 { top: 28%; left: 23%; transform: rotate(-6deg); }
    .note-2 { top: 42%; left: 13%; transform: rotate(4deg); }
    .note-3 { top: 62%; left: 22%; transform: rotate(-5deg); }
    
    .note-4 { top: 26%; right: 23%; transform: rotate(5deg); }
    .note-5 { top: 42%; right: 13%; transform: rotate(-4deg); }
    .note-6 { top: 62%; right: 22%; transform: rotate(6deg); }

    /* Button sa ibaba */
    .btn-light-green {
        background-color: #4CAF50 !important;
        border-color: #388E3C !important;
        color: #ffffff !important;
        font-weight: 600;
        transition: background-color 0.2s ease;
        z-index: 2;
    }

    .btn-light-green:hover {
        background-color: #43A047 !important;
        border-color: #2E7D32 !important;
        color: #ffffff !important;
    }
</style>

<!-- Spotify Music Player sa Kaliwang Sulok -->
<div class="spotify-container">
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/3iBgrkexCzVuPy4O9vx7Mf?utm_source=generator&si=6b252b5299504872" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>

<div class="center-wrapper">
    <!-- Title sa Itaas -->
    <div class="page-title">flowers for you!</div>

    <!-- Mga Floating Text sa Palibot -->
    <div class="floating-note note-1">I LOVE YOU</div>
    <div class="floating-note note-2">HAPPY BIRTHDAY</div>
    <div class="floating-note note-3">I MISS YOU</div>

    <div class="floating-note note-4">SWEET BOY</div>
    <div class="floating-note note-5">LOVE LOVE</div>
    <div class="floating-note note-6">PHOESAI</div>

    <!-- Mga Larawan sa Gilid at Ibaba -->
    <img src="~/images/hi.png" alt="Bottom Left Image" class="bottom-left-img" />
    <img src="~/images/ro.png" alt="Bottom Right Image" class="bottom-right-img" />
    <img src="~/images/co.png" alt="Top Right Image" class="top-right-img" />

    <!-- Larawan sa gitna -->
    <img src="~/images/ge.png" alt="Surprise Image" class="center-image" />
    
    <!-- Button sa ibaba -->
    <div style="margin-top: 15px; z-index: 2;">
        <a href="/Index" class="btn btn-light-green" style="border-radius: 8px; padding: 6px 18px;">Back to Home</a>
    </div>
</div>
