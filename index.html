@page
@model IndexModel
@{
    ViewData["Title"] = "Home page";
}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Poppins:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
    body {
        display: none;
        background-color: #E0F7FA;
        overflow-x: hidden;
    }

    .garland-banner-wrapper {
        position: absolute;
        top: -100px;
        left: 0;
        width: 100vw;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        z-index: 1;
    }

    .garland-img-left {
        width: 90%;
        height: 300px;
        object-fit: contain;
        margin-left: -110px;
    }

    .garland-img-right {
        width: 90%;
        height: 300px;
        object-fit: contain;
        margin-right: 85px;
    }

    .birthday-image {
        max-width: 100%;
        width: 800px;
        height: auto;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.15));
    }

    .bear-wrapper {
        position: relative;
        width: 320px;
        height: 280px;
        transition: transform 0.3s ease;
        filter: drop-shadow(0px 8px 15px rgba(53, 122, 189, 0.15));
    }

        .bear-wrapper:hover {
            transform: scale(1.05);
        }

    .bear-text {
        position: relative;
        z-index: 10;
        margin: 90px;
        color: #0B192C;
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 600;
        font-size: 1.4rem;
        letter-spacing: 1px;
    }

    .corner-image-left {
        position: absolute;
        top: 350px;
        left: -100px;
        width: 200px;
        height: auto;
        z-index: 3;
    }

    .corner-image-right {
        position: absolute;
        top: 350px;
        right: -100px;
        width: 200px;
        height: auto;
        z-index: 3;
    }

    .upper-image-right {
        position: absolute;
        top: 70px;
        right: -50px;
        width: 200px;
        height: auto;
        z-index: 3;
    }

    .upper-image-left {
        position: absolute;
        top: 90px;
        left: -80px;
        width: 150px;
        height: auto;
        z-index: 3;
    }
</style>

<script>
    localStorage.removeItem('birthdayQuizSolved');
    if (sessionStorage.getItem('birthdayQuizSolved') !== 'true') {
        window.location.href = '/Privacy';
    } else {
        document.documentElement.style.display = 'block';
        document.body.style.display = 'block';
    }
</script>

<div style="position: relative; width: 100%;">

    <div class="garland-banner-wrapper">
        <img src="~/images/star.png" alt="Star Garland Left" class="garland-img-left" />
        <img src="~/images/star.png" alt="Star Garland Right" class="garland-img-right" />
    </div>

    <img src="~/images/gift.png" alt="Left Side Picture" class="corner-image-left" />
    <img src="~/images/cal.png" alt="Right Side Picture" class="corner-image-right" />
    <img src="~/images/fly.png" alt="Right Side Picture" class="upper-image-right" />
    <img src="~/images/squid.png" alt="Left Side Picture" class="upper-image-left" />

    <div class="text-center" style="margin-top: 70px;">
        <div>
            <img src="~/images/happys.png" alt="Happy Birthday, Sai!" class="birthday-image" />
        </div>

        <div style="margin-top: 30px; font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem; color: #4A6B82; font-weight: 600; text-decoration: underline;">
            Welcome, love love! I hope you like it, enjoy your day to the fullest!
        </div>

        <div style="display: flex; justify-content: center; gap: 50px; max-width: 1200px; margin: 120px auto 0 auto; font-family: 'Poppins', sans-serif;">

            <!-- About Us Bear -->
            <a href="/AboutUs" style="text-decoration: none; color: inherit;">
                <div class="bear-wrapper" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <img src="~/images/bear.png" alt="Bear" style="max-width: 100%; height: auto; position: relative; z-index: 2;" />
                    <h3 class="bear-text" style="margin-top: 15px; position: relative; z-index: 3;">Click Here!</h3>
                </div>
            </a>

            <!-- Memories Bear -->
            <a href="/Memories" style="text-decoration: none; color: inherit;">
                <div class="bear-wrapper" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <img src="~/images/bear.png" alt="Bear" style="max-width: 100%; height: auto; position: relative; z-index: 2;" />
                    <h3 class="bear-text" style="margin-top: 15px; position: relative; z-index: 3;">Click Here!</h3>
                </div>
            </a>

            <!-- Surprise Note Bear -->
            <a href="/SurpriseNote" style="text-decoration: none; color: inherit;">
                <div class="bear-wrapper" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <img src="~/images/bear.png" alt="Bear" style="max-width: 100%; height: auto; position: relative; z-index: 2;" />
                    <h3 class="bear-text" style="margin-top: 15px; position: relative; z-index: 3;">Click Here!</h3>
                </div>
            </a>

        </div>
    </div>
</div>
